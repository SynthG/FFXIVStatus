name: FFXIVNews to Teams

# Force GitHub to re-register the cron (schedule has never fired on this repo).
on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll FortniteStatus and post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python watch.py

      - name: Save seen IDs
        run: |
          git config user.name "FFXIVNews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && echo "No seen.json change" && exit 0
          git commit -m "Update seen FFXIVNews IDs"
          git pull --rebase origin main
          git push
